<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上摸彩機</title>
    <script src="https://cdn.tailwindcss.com" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', 'Inter', sans-serif; background: radial-gradient(circle at top, #FEE2E2, #DBEAFE); }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-radius: 1rem; box-shadow: 0 20px 60px -25px rgba(15, 23, 42, 0.45); }
        .lottery-badge { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0.75rem; border-radius: 9999px; background: linear-gradient(135deg, #6366F1, #EC4899); color: white; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
        .winner-highlight { animation: pulse 1.5s ease-in-out 1; }
        @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.3; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="min-h-screen text-slate-800 px-4 py-6 sm:py-10">
    <div class="max-w-6xl mx-auto space-y-8">
        <header class="text-center space-y-4">
            <span class="lottery-badge">Lucky Draw</span>
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-slate-900">線上摸彩抽獎機</h1>
            <p class="text-slate-600 max-w-2xl mx-auto">建立參加名單、設定籤數，按下抽獎鍵即可隨機選出幸運兒。資料僅存於本地瀏覽器，適合快速小型活動或抽獎遊戲。</p>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <section class="lg:col-span-2 space-y-6">
                <div class="glass-card p-6 space-y-4">
                    <h2 class="text-xl font-semibold text-slate-900">新增參加者</h2>
                    <form id="addForm" class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
                        <label class="md:col-span-3">
                            <span class="block text-sm font-medium text-slate-600">參加者姓名</span>
                            <input id="nameInput" type="text" required placeholder="例如：王小明" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                        </label>
                        <label class="md:col-span-1">
                            <span class="block text-sm font-medium text-slate-600">籤數</span>
                            <input id="ticketInput" type="number" min="1" max="50" value="1" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
                        </label>
                        <button type="submit" class="md:col-span-1 inline-flex justify-center items-center gap-2 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-indigo-200 transition hover:bg-indigo-700">新增</button>
                    </form>
                    <div class="border-t border-slate-200 pt-4 space-y-3">
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                            <h3 class="text-sm font-semibold text-slate-700">批次匯入</h3>
                            <button id="sampleBtn" class="text-xs font-medium text-indigo-600 hover:underline">載入範例資料</button>
                        </div>
                        <textarea id="bulkInput" rows="3" placeholder="每行輸入：姓名, 籤數（可省略，預設 1）" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-indigo-500"></textarea>
                        <div class="flex flex-col sm:flex-row gap-3 justify-between">
                            <button id="bulkAddBtn" class="inline-flex items-center justify-center gap-2 rounded-lg border border-indigo-600 px-4 py-2 text-sm font-semibold text-indigo-600 transition hover:bg-indigo-50">匯入資料</button>
                            <button id="clearBtn" class="inline-flex items-center justify-center gap-2 rounded-lg border border-rose-500 px-4 py-2 text-sm font-semibold text-rose-500 transition hover:bg-rose-50">清空名單</button>
                        </div>
                        <p id="bulkStatus" class="text-xs text-rose-500"></p>
                    </div>
                </div>

                <div class="glass-card p-6 space-y-4">
                    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                        <h2 class="text-xl font-semibold text-slate-900">參加名單</h2>
                        <p class="text-sm text-slate-500" id="participantStats">共 0 人／0 籤</p>
                    </div>
                    <div class="overflow-hidden rounded-lg border border-slate-200">
                        <table class="min-w-full divide-y divide-slate-200 text-sm">
                            <thead class="bg-slate-50">
                                <tr>
                                    <th class="px-4 py-3 text-left font-semibold text-slate-600">姓名</th>
                                    <th class="px-4 py-3 text-center font-semibold text-slate-600">籤數</th>
                                    <th class="px-4 py-3 text-center font-semibold text-slate-600">操作</th>
                                </tr>
                            </thead>
                            <tbody id="participantBody" class="divide-y divide-slate-100 bg-white"></tbody>
                        </table>
                    </div>
                    <p class="text-xs text-slate-500">籤數代表該參與者在抽獎池中擁有的機率權重。</p>
                </div>
            </section>

            <aside class="space-y-6">
                <div class="glass-card p-6 space-y-4">
                    <h2 class="text-xl font-semibold text-slate-900">開始抽獎</h2>
                    <label class="flex items-center gap-2 text-sm text-slate-600">
                        <input type="checkbox" id="removeAfterDraw" class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500" checked>
                        抽出後自名單移除
                    </label>
                    <button id="drawBtn" class="w-full inline-flex justify-center items-center gap-2 rounded-xl bg-rose-500 px-4 py-3 font-semibold text-white text-lg shadow-lg shadow-rose-200 transition hover:bg-rose-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-rose-400">
                        開始抽獎
                    </button>
                    <div class="rounded-xl border border-rose-100 bg-white/70 px-4 py-6 text-center shadow-inner">
                        <p class="text-sm text-slate-500 mb-2">本輪幸運兒</p>
                        <p id="winnerName" class="text-2xl font-bold text-rose-600">尚未抽出</p>
                        <p id="winnerTickets" class="text-xs text-slate-400 mt-1"></p>
                    </div>
                </div>

                <div class="glass-card p-6 space-y-4">
                    <h2 class="text-xl font-semibold text-slate-900">歷史紀錄</h2>
                    <ul id="historyList" class="space-y-3 text-sm text-slate-600">
                        <li class="text-slate-400">尚無抽獎紀錄</li>
                    </ul>
                </div>
            </aside>
        </main>
    </div>

    <script>
        const addForm = document.getElementById('addForm');
        const nameInput = document.getElementById('nameInput');
        const ticketInput = document.getElementById('ticketInput');
        const participantBody = document.getElementById('participantBody');
        const participantStats = document.getElementById('participantStats');
        const drawBtn = document.getElementById('drawBtn');
        const winnerName = document.getElementById('winnerName');
        const winnerTickets = document.getElementById('winnerTickets');
        const removeAfterDraw = document.getElementById('removeAfterDraw');
        const historyList = document.getElementById('historyList');
        const clearBtn = document.getElementById('clearBtn');
        const bulkInput = document.getElementById('bulkInput');
        const bulkAddBtn = document.getElementById('bulkAddBtn');
        const bulkStatus = document.getElementById('bulkStatus');
        const sampleBtn = document.getElementById('sampleBtn');

        let participants = [];
        let drawInProgress = false;

        function renderParticipants() {
            participantBody.innerHTML = '';
            if (!participants.length) {
                participantBody.innerHTML = '<tr><td colspan="3" class="px-4 py-6 text-center text-slate-400">尚未新增任何參加者</td></tr>';
            } else {
                participants.forEach((person) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="px-4 py-3 font-medium text-slate-700">${person.name}</td>
                        <td class="px-4 py-3 text-center text-slate-500">${person.tickets}</td>
                        <td class="px-4 py-3 text-center">
                            <button class="text-sm font-medium text-rose-500 hover:text-rose-600" data-action="remove" data-id="${person.id}">移除</button>
                        </td>`;
                    participantBody.appendChild(row);
                });
            }
            updateStats();
        }

        function updateStats() {
            const totalTickets = participants.reduce((sum, p) => sum + p.tickets, 0);
            participantStats.textContent = `共 ${participants.length} 人／${totalTickets} 籤`;
        }

        function showBulkStatus(message, success = false) {
            bulkStatus.textContent = message;
            bulkStatus.classList.toggle('text-rose-500', !success);
            bulkStatus.classList.toggle('text-emerald-600', success);
        }

        function addParticipant(name, tickets) {
            const trimmed = name.trim();
            if (!trimmed) return;
            const count = Math.max(1, Math.min(50, Number(tickets) || 1));
            const existing = participants.find(p => p.name === trimmed);
            if (existing) {
                existing.tickets += count;
            } else {
                participants.push({ id: crypto.randomUUID(), name: trimmed, tickets: count });
            }
            participants.sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
            renderParticipants();
        }

        addForm.addEventListener('submit', (event) => {
            event.preventDefault();
            addParticipant(nameInput.value, ticketInput.value);
            nameInput.value = '';
            ticketInput.value = 1;
            nameInput.focus();
        });

        participantBody.addEventListener('click', (event) => {
            const target = event.target;
            if (target.dataset.action === 'remove') {
                participants = participants.filter(p => p.id !== target.dataset.id);
                renderParticipants();
            }
        });

        clearBtn.addEventListener('click', () => {
            if (!participants.length) return;
            if (confirm('確定要清空所有參加者嗎？')) {
                participants = [];
                renderParticipants();
                winnerName.textContent = '尚未抽出';
                winnerTickets.textContent = '';
                historyList.innerHTML = '<li class="text-slate-400">尚無抽獎紀錄</li>';
            }
        });

        bulkAddBtn.addEventListener('click', () => {
            const lines = bulkInput.value.split('\n').map(line => line.trim()).filter(Boolean);
            if (!lines.length) {
                showBulkStatus('請輸入至少一行資料');
                return;
            }
            let successCount = 0;
            let errorLines = [];
            lines.forEach((line, index) => {
                const parts = line.split(',').map(part => part.trim()).filter(Boolean);
                if (!parts.length) return;
                const [name, ticketStr] = parts;
                const tickets = ticketStr ? Number(ticketStr) : 1;
                if (!name) {
                    errorLines.push(index + 1);
                    return;
                }
                if (ticketStr && (Number.isNaN(tickets) || tickets <= 0)) {
                    errorLines.push(index + 1);
                    return;
                }
                addParticipant(name, tickets);
                successCount += 1;
            });
            if (successCount) {
                showBulkStatus(`成功匯入 ${successCount} 筆資料`, true);
                bulkInput.value = '';
            }
            if (errorLines.length) {
                showBulkStatus(`第 ${errorLines.join('、')} 行格式有誤，請確認`);
            }
        });

        sampleBtn.addEventListener('click', () => {
            const sampleData = ['王小明, 3', '陳美麗, 1', '林家豪, 2', '張婷婷', '劉小安'];
            bulkInput.value = sampleData.join('\n');
            showBulkStatus('已載入範例資料，確認後可按「匯入資料」');
        });

        function buildEntryPool() {
            const pool = [];
            participants.forEach((person) => {
                for (let i = 0; i < person.tickets; i += 1) {
                    pool.push(person.id);
                }
            });
            return pool;
        }

        function updateHistory(name) {
            const timestamp = new Date().toLocaleString();
            const item = document.createElement('li');
            item.className = 'rounded-lg border border-slate-100 bg-white/70 px-3 py-2 shadow-sm';
            item.innerHTML = `<p class="font-semibold text-slate-800">${name}</p><p class="text-xs text-slate-400">${timestamp}</p>`;
            if (historyList.firstElementChild && historyList.firstElementChild.textContent === '尚無抽獎紀錄') {
                historyList.innerHTML = '';
            }
            historyList.prepend(item);
            while (historyList.children.length > 10) {
                historyList.removeChild(historyList.lastChild);
            }
        }

        function animateWinner(name, tickets) {
            winnerName.textContent = name;
            winnerTickets.textContent = tickets > 1 ? `擁有 ${tickets} 籤` : '擁有 1 籤';
            winnerName.classList.remove('winner-highlight');
            void winnerName.offsetWidth;
            winnerName.classList.add('winner-highlight');
        }

        drawBtn.addEventListener('click', () => {
            if (drawInProgress) return;
            const pool = buildEntryPool();
            if (!pool.length) {
                winnerName.textContent = '請先新增參加者';
                winnerTickets.textContent = '';
                return;
            }
            drawInProgress = true;
            drawBtn.disabled = true;
            drawBtn.classList.add('opacity-60', 'cursor-not-allowed');
            const duration = 1800;
            const intervalTime = 120;
            const startTime = Date.now();

            const animationInterval = setInterval(() => {
                const randomId = pool[Math.floor(Math.random() * pool.length)];
                const preview = participants.find(p => p.id === randomId);
                if (preview) {
                    winnerName.textContent = preview.name;
                    winnerTickets.textContent = preview.tickets > 1 ? `擁有 ${preview.tickets} 籤` : '擁有 1 籤';
                }
                if (Date.now() - startTime >= duration) {
                    clearInterval(animationInterval);
                    const finalId = pool[Math.floor(Math.random() * pool.length)];
                    const winner = participants.find(p => p.id === finalId);
                    if (winner) {
                        animateWinner(winner.name, winner.tickets);
                        updateHistory(winner.name);
                        if (removeAfterDraw.checked) {
                            participants = participants.filter(p => p.id !== winner.id);
                            renderParticipants();
                        }
                    }
                    drawInProgress = false;
                    drawBtn.disabled = false;
                    drawBtn.classList.remove('opacity-60', 'cursor-not-allowed');
                }
            }, intervalTime);
        });

        renderParticipants();
    </script>
</body>
</html>
